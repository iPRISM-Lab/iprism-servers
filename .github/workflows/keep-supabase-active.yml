name: Keep Supabase Active

on:
  schedule:
    # Three small database requests per day, at off-peak UTC minutes.
    - cron: "17 5,13,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase database
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: iprism-hub
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY must be configured in the iprism-hub environment."
            exit 1
          fi

      - name: Call keepalive RPC
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --request POST \
            --url "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors

          echo "Supabase keep-alive request succeeded."
